{% extends "base.html" %}

{% block content %}

  {% if not "\x3ch1" in page.content %}
    <h1>{{ page.title | d(config.site_name, true) }}</h1>
  {% endif %}

  {% if page.meta and page.meta.git_revision_date_localized %}
    <div class="md-source-file">
      {{ page.meta.git_revision_date_localized }}
    </div>
  {% endif %}

  {{ page.content }}

{% endblock %}
